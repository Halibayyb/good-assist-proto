<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Decision Behind the Assist</title>
</head>
<body>
<div class="page">
  <h1>The Decision Behind the Assist</h1>
  <p class="sub">Every broadcast shows the goal. We show the decision that made it possible.</p>

  <div class="picker" id="picker"></div>

  <div class="stage">
    <div class="pitch-wrap">
      <svg id="pitch" viewBox="0 0 1000 600" role="img" aria-label="Perspective view of the attacking end with all outfield players frozen at the moment of the pass">
        <defs>
          <marker id="head-opt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
          </marker>
          <marker id="head-played" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
          </marker>

          <!-- line-art player, feet at (0,0), facing right, ~91 units tall.
               Colours come from --kit (shirt), --short and --sock set on each <use>. -->
          <symbol id="fig-run" overflow="visible">
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M-7,-67 L-16,-57 L-11,-47" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-7,-67 L-16,-57 L-11,-47" style="stroke:var(--kit)" stroke-width="4.2"/>
              <path d="M-3,-40 L-12,-22 L-25,-9" stroke="#262b36" stroke-width="9"/>
              <path d="M-3,-40 L-12,-22 L-25,-9" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-10,-73 Q0,-77 10,-73 L9,-47 L-9,-47 Z" style="fill:var(--kit)" stroke="#262b36" stroke-width="2"/>
              <path d="M-9,-48 L9,-48 L11,-35 L-11,-35 Z" style="fill:var(--short)" stroke="#262b36" stroke-width="2"/>
              <path d="M3,-38 L12,-24 L13,-1" stroke="#262b36" stroke-width="9"/>
              <path d="M3,-38 L12,-24 L13,-1" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M7,-67 L17,-58 L25,-63" stroke="#262b36" stroke-width="7.5"/>
              <path d="M7,-67 L17,-58 L25,-63" style="stroke:var(--kit)" stroke-width="4.2"/>
              <circle cx="2" cy="-83" r="7.5" fill="#f3efe7" stroke="#262b36" stroke-width="2"/>
              <path d="M-5.5,-84 Q-3,-92 3,-91 Q9,-90 9.5,-84 Q4,-87 -5.5,-84 Z" fill="#262b36" stroke="none"/>
            </g>
          </symbol>
          <symbol id="fig-run2" overflow="visible">
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M7,-67 L14,-57 L9,-47" stroke="#262b36" stroke-width="7.5"/>
              <path d="M7,-67 L14,-57 L9,-47" style="stroke:var(--kit)" stroke-width="4.2"/>
              <path d="M-3,-40 L-7,-21 L-9,-1" stroke="#262b36" stroke-width="9"/>
              <path d="M-3,-40 L-7,-21 L-9,-1" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-10,-73 Q0,-77 10,-73 L9,-47 L-9,-47 Z" style="fill:var(--kit)" stroke="#262b36" stroke-width="2"/>
              <path d="M-9,-48 L9,-48 L11,-35 L-11,-35 Z" style="fill:var(--short)" stroke="#262b36" stroke-width="2"/>
              <path d="M3,-38 L14,-30 L22,-15" stroke="#262b36" stroke-width="9"/>
              <path d="M3,-38 L14,-30 L22,-15" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-7,-67 L-1,-58 L8,-62" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-7,-67 L-1,-58 L8,-62" style="stroke:var(--kit)" stroke-width="4.2"/>
              <circle cx="2" cy="-83" r="7.5" fill="#f3efe7" stroke="#262b36" stroke-width="2"/>
              <path d="M-5.5,-84 Q-3,-92 3,-91 Q9,-90 9.5,-84 Q4,-87 -5.5,-84 Z" fill="#262b36" stroke="none"/>
            </g>
          </symbol>
          <symbol id="fig-head" overflow="visible">
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M-7,-67 L-19,-63 L-27,-71" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-7,-67 L-19,-63 L-27,-71" style="stroke:var(--kit)" stroke-width="4.2"/>
              <path d="M-3,-40 L-11,-27 L-21,-15" stroke="#262b36" stroke-width="9"/>
              <path d="M-3,-40 L-11,-27 L-21,-15" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-12,-72 Q-2,-77 8,-72 L8,-47 L-10,-47 Z" style="fill:var(--kit)" stroke="#262b36" stroke-width="2"/>
              <path d="M-10,-48 L8,-48 L11,-35 L-11,-35 Z" style="fill:var(--short)" stroke="#262b36" stroke-width="2"/>
              <path d="M3,-38 L10,-22 L3,-8" stroke="#262b36" stroke-width="9"/>
              <path d="M3,-38 L10,-22 L3,-8" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M7,-67 L19,-70 L27,-79" stroke="#262b36" stroke-width="7.5"/>
              <path d="M7,-67 L19,-70 L27,-79" style="stroke:var(--kit)" stroke-width="4.2"/>
              <circle cx="6" cy="-85" r="7.5" fill="#f3efe7" stroke="#262b36" stroke-width="2"/>
              <path d="M-1.5,-86 Q1,-94 7,-93 Q13,-92 13.5,-86 Q8,-89 -1.5,-86 Z" fill="#262b36" stroke="none"/>
            </g>
          </symbol>
          <symbol id="fig-crouch" overflow="visible">
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M-6,-56 L-13,-45 L-9,-36" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-6,-56 L-13,-45 L-9,-36" style="stroke:var(--kit)" stroke-width="4.2"/>
              <path d="M-3,-30 L-12,-17 L-7,-1" stroke="#262b36" stroke-width="9"/>
              <path d="M-3,-30 L-12,-17 L-7,-1" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-8,-62 Q2,-67 12,-60 L8,-36 L-9,-36 Z" style="fill:var(--kit)" stroke="#262b36" stroke-width="2"/>
              <path d="M-10,-37 L8,-37 L10,-25 L-11,-25 Z" style="fill:var(--short)" stroke="#262b36" stroke-width="2"/>
              <path d="M4,-28 L14,-16 L10,-1" stroke="#262b36" stroke-width="9"/>
              <path d="M4,-28 L14,-16 L10,-1" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M9,-58 L19,-50 L26,-54" stroke="#262b36" stroke-width="7.5"/>
              <path d="M9,-58 L19,-50 L26,-54" style="stroke:var(--kit)" stroke-width="4.2"/>
              <circle cx="9" cy="-71" r="7.5" fill="#f3efe7" stroke="#262b36" stroke-width="2"/>
              <path d="M1.5,-72 Q4,-80 10,-79 Q16,-78 16.5,-72 Q11,-75 1.5,-72 Z" fill="#262b36" stroke="none"/>
            </g>
          </symbol>
          <symbol id="fig-slide" overflow="visible">
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M-8,-38 L-17,-25 L-22,-11" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-8,-38 L-17,-25 L-22,-11" style="stroke:var(--kit)" stroke-width="4.2"/>
              <path d="M-1,-14 L9,-22 L19,-11" stroke="#262b36" stroke-width="9"/>
              <path d="M-1,-14 L9,-22 L19,-11" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-16,-44 Q-8,-50 1,-42 L5,-20 L-9,-17 Z" style="fill:var(--kit)" stroke="#262b36" stroke-width="2"/>
              <path d="M-10,-22 L5,-22 L8,-9 L-9,-8 Z" style="fill:var(--short)" stroke="#262b36" stroke-width="2"/>
              <path d="M1,-12 L17,-8 L32,-5" stroke="#262b36" stroke-width="9"/>
              <path d="M1,-12 L17,-8 L32,-5" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-3,-41 L9,-49 L22,-53" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-3,-41 L9,-49 L22,-53" style="stroke:var(--kit)" stroke-width="4.2"/>
              <circle cx="-11" cy="-53" r="7.5" fill="#f3efe7" stroke="#262b36" stroke-width="2"/>
              <path d="M-18.5,-54 Q-16,-62 -10,-61 Q-4,-60 -3.5,-54 Q-9,-57 -18.5,-54 Z" fill="#262b36" stroke="none"/>
            </g>
          </symbol>
          <symbol id="fig-stand" overflow="visible">
            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M-8,-67 L-12,-52 L-11,-42" stroke="#262b36" stroke-width="7.5"/>
              <path d="M-8,-67 L-12,-52 L-11,-42" style="stroke:var(--kit)" stroke-width="4.2"/>
              <path d="M-3,-40 L-5,-20 L-6,-1" stroke="#262b36" stroke-width="9"/>
              <path d="M-3,-40 L-5,-20 L-6,-1" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M3,-40 L5,-20 L6,-1" stroke="#262b36" stroke-width="9"/>
              <path d="M3,-40 L5,-20 L6,-1" style="stroke:var(--sock)" stroke-width="5.5"/>
              <path d="M-10,-73 Q0,-77 10,-73 L9,-47 L-9,-47 Z" style="fill:var(--kit)" stroke="#262b36" stroke-width="2"/>
              <path d="M-9,-48 L9,-48 L11,-35 L-11,-35 Z" style="fill:var(--short)" stroke="#262b36" stroke-width="2"/>
              <path d="M8,-67 L12,-52 L11,-42" stroke="#262b36" stroke-width="7.5"/>
              <path d="M8,-67 L12,-52 L11,-42" style="stroke:var(--kit)" stroke-width="4.2"/>
              <circle cx="1" cy="-83" r="7.5" fill="#f3efe7" stroke="#262b36" stroke-width="2"/>
              <path d="M-5.5,-84 Q-3,-92 2,-91 Q8,-90 8.5,-84 Q3,-87 -5.5,-84 Z" fill="#262b36" stroke="none"/>
            </g>
          </symbol>
        </defs>

        <g id="turf"></g>          <!-- stripes, markings, goal: drawn in main.js from the projection -->
        <g id="groundRings"></g>   <!-- ellipses on the grass under ringed players -->
        <g id="players"></g>
        <g id="overlay"></g>       <!-- glass spheres, arrows, labels -->
        <g id="ball">
          <polyline id="trail" fill="none" stroke="#1f2430" stroke-width="1.6" stroke-opacity=".4" stroke-dasharray="5 5" stroke-linejoin="round"/>
          <ellipse id="ballShadow" fill="#1f2430" fill-opacity=".22"/>
          <circle id="ballDot" r="6" fill="#fff" stroke="#1f2430" stroke-width="1.8"/>
        </g>
        <g id="goalFlash" opacity="0">
          <rect x="360" y="230" width="280" height="120" rx="10" fill="#1f2430" fill-opacity=".88"/>
          <text x="500" y="312" text-anchor="middle" font-size="76" font-weight="800" fill="#f4f4ef" font-family="ui-monospace, Menlo, monospace">GOAL!</text>
        </g>
      </svg>
      <div id="tip" role="status"></div>
    </div>

    <aside class="panel">
      <button class="play-btn" id="playBtn" type="button">▶ Play the moment</button>
      <p id="status"></p>
      <div id="result"></div>
    </aside>
  </div>

  <p class="foot">Synthetic data only. Chance-it-arrives, chance-of-a-goal and expected value are model estimates;
  "defenders cut out" is counted straight from the player positions.</p>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
